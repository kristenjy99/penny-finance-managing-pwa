<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Penny</title>
  <meta name="description" content="Penny – quản lý tài chính cá nhân">
  <meta name="theme-color" content="#C5B3D3">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Penny">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Áp chế độ màu sớm để không nháy màn hình
    (function () {
      var t = 'auto';
      try { t = localStorage.getItem('penny_theme') || 'auto'; } catch (e) {}
      var dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    })();
  </script>
</head>
<body>
  <div class="app" id="app">
    <aside class="side" id="side"></aside>
    <div class="main">
      <header class="top" id="top"></header>
      <main class="content" id="content"><div class="empty">Đang tải…</div></main>
    </div>
    <nav class="tabbar" id="tabbar" aria-label="Điều hướng"></nav>
    <button class="fab" id="fab" aria-label="Thêm giao dịch" data-act="add">
      <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </div>
  <div id="layer"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <noscript>Penny cần bật JavaScript.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
